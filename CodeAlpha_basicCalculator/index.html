<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A premium, state-of-the-art web calculator with glassmorphic dark design, micro-animations, and full keyboard accessibility.">
  <title>Web Calculator</title>
  <!-- Google Fonts: Inter for UI, Orbitron for display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background-decorations">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <main class="calculator-container" id="calculator-app">
    <header class="calculator-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>KRONOS</h1>
      </div>
      <button class="history-toggle-btn" id="history-toggle-btn" aria-label="Toggle calculation history">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </button>
    </header>

    <!-- Calculator Screen -->
    <section class="calculator-screen">
      <div class="expression-display" id="expression-display" aria-live="polite"></div>
      <div class="main-display" id="main-display" role="textbox" aria-readonly="true" aria-label="Current value">0</div>
    </section>

    <!-- Calculator Keyboard -->
    <section class="calculator-keypad">
      <!-- Row 1: Actions -->
      <button id="btn-clear" class="btn btn-action" data-action="clear" aria-label="Clear all">AC</button>
      <button id="btn-backspace" class="btn btn-action" data-action="backspace" aria-label="Delete last character">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0 -2-2z" />
          <line x1="18" y1="9" x2="12" y2="15" />
          <line x1="12" y1="9" x2="18" y2="15" />
        </svg>
      </button>
      <button id="btn-percent" class="btn btn-action" data-action="percent" aria-label="Percentage">%</button>
      <button id="btn-divide" class="btn btn-operator" data-action="operator" data-value="/"
        aria-label="Divide">÷</button>

      <!-- Row 2: Numbers & Multiplier -->
      <button id="btn-7" class="btn btn-number" data-value="7">7</button>
      <button id="btn-8" class="btn btn-number" data-value="8">8</button>
      <button id="btn-9" class="btn btn-number" data-value="9">9</button>
      <button id="btn-multiply" class="btn btn-operator" data-action="operator" data-value="*"
        aria-label="Multiply">×</button>

      <!-- Row 3: Numbers & Subtraction -->
      <button id="btn-4" class="btn btn-number" data-value="4">4</button>
      <button id="btn-5" class="btn btn-number" data-value="5">5</button>
      <button id="btn-6" class="btn btn-number" data-value="6">6</button>
      <button id="btn-subtract" class="btn btn-operator" data-action="operator" data-value="-"
        aria-label="Subtract">−</button>

      <!-- Row 4: Numbers & Addition -->
      <button id="btn-1" class="btn btn-number" data-value="1">1</button>
      <button id="btn-2" class="btn btn-number" data-value="2">2</button>
      <button id="btn-3" class="btn btn-number" data-value="3">3</button>
      <button id="btn-add" class="btn btn-operator" data-action="operator" data-value="+" aria-label="Add">+</button>

      <!-- Row 5: Decimals, Negatives & Equal -->
      <button id="btn-toggle-sign" class="btn btn-action" data-action="toggle-sign"
        aria-label="Toggle positive or negative">±</button>
      <button id="btn-0" class="btn btn-number" data-value="0">0</button>
      <button id="btn-decimal" class="btn btn-number" data-value=".">.</button>
      <button id="btn-equals" class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
    </section>

    <!-- Sliding History Panel -->
    <aside class="history-panel" id="history-panel" aria-label="Calculation history">
      <div class="history-panel-header">
        <h2>History</h2>
        <button id="btn-clear-history" class="btn-clear-history" aria-label="Clear history">Clear</button>
      </div>
      <div class="history-list" id="history-list">
        <p class="no-history-msg">No history yet</p>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>

</html>
